spring:
  application:
    name: haulwise
  config:
    # Local, git-ignored overrides (see .env.example). Missing file is fine.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:haulwise;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: ${HAULWISE_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true

haulwise:
  cors:
    allowed-origins: ${HAULWISE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${HAULWISE_SEED_ENABLED:true}
  solver:
    max-brute-force-stops: 8
  osrm:
    base-url: ${HAULWISE_OSRM_BASE_URL:https://router.project-osrm.org}
    truck-duration-factor: 1.2
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${HAULWISE_AI_MODEL:}
