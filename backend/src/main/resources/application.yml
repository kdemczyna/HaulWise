spring:
  application:
    name: haulwise
  config:
    # Local, git-ignored overrides (see .env.example). Missing file is fine.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:haulwise;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: ${HAULWISE_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # 20.7 for an integer field is a 400, not silently truncated to 20
      accept-float-as-int: false
      # "priority": 1 is a 400 listing the allowed values, not silently the enum at index 1
      fail-on-numbers-for-enums: true

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

haulwise:
  cors:
    allowed-origins: ${HAULWISE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${HAULWISE_SEED_ENABLED:true}
  solver:
    max-brute-force-stops: 8
    # Kept well under the 12 startup-validated limit: at the limit, enumerating every subset of a
    # fleet this size with max-brute-force-stops-sized routes measured ~21s per request (see
    # ARCHITECTURE.md); 7 (127 subsets) keeps the synchronous /api/trucks/recommend call well under
    # typical browser/proxy timeouts while still covering the seeded 5-truck demo fleet with headroom.
    max-recommendation-trucks: 7
  osrm:
    base-url: ${HAULWISE_OSRM_BASE_URL:https://router.project-osrm.org}
    truck-duration-factor: 1.2
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${HAULWISE_AI_MODEL:}
